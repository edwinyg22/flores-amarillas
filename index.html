<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramo de Flores Amarillas Brillantísimo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a2f1c;
      font-family: 'Georgia', serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <canvas id="mainCanvas"></canvas>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    let time = 0;

    // Partículas doradas extras y muy luminosas
    const particles = Array.from({ length: 80 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      radius: Math.random() * 3.5 + 1.5,
      speedY: -(Math.random() * 0.6 + 0.2),
      speedX: Math.random() * 0.5 - 0.25,
      opacity: Math.random() * 0.9 + 0.3
    }));

    // Dibujo de flor individual brillante
    function drawFlower(x, y, scale) {
      ctx.save();
      ctx.translate(x, y);

      // Pétalos Amarillo Neón / Sol (Muy resplandecientes)
      const petals = 12;
      ctx.fillStyle = '#ffff33';
      ctx.shadowBlur = 25;
      ctx.shadowColor = '#ffea00';

      for (let i = 0; i < petals; i++) {
        const angle = (i * Math.PI * 2) / petals;
        ctx.save();
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.ellipse(0, 22 * scale, 9.5 * scale, 21 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Capa interior de pétalos para dar volumen y brillo
      ctx.fillStyle = '#ffcc00';
      for (let i = 0; i < petals; i++) {
        const angle = ((i + 0.5) * Math.PI * 2) / petals;
        ctx.save();
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.ellipse(0, 15 * scale, 7 * scale, 14 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Centro de la flor
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(0, 0, 12 * scale, 0, Math.PI * 2);
      ctx.fillStyle = '#8b4513';
      ctx.fill();

      ctx.restore();
    }

    // Dibujo del Ramo
    function drawBouquet(centerX, centerY, wind) {
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(wind);

      // Envoltura/Papel Claro del Ramo
      ctx.fillStyle = '#d4a373';
      ctx.shadowBlur = 15;
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.moveTo(0, 140);
      ctx.lineTo(-70, -10);
      ctx.lineTo(70, -10);
      ctx.closePath();
      ctx.fill();

      // Capa interior de la envoltura
      ctx.fillStyle = '#faedcd';
      ctx.beginPath();
      ctx.moveTo(0, 140);
      ctx.lineTo(-60, -10);
      ctx.lineTo(60, -10);
      ctx.closePath();
      ctx.fill();

      // Tallos verdes vibrantes
      ctx.strokeStyle = '#38b000';
      ctx.lineWidth = 5;
      const stemAngles = [-0.3, -0.15, 0, 0.15, 0.3];
      stemAngles.forEach(ang => {
        ctx.beginPath();
        ctx.moveTo(0, 100);
        ctx.lineTo(Math.sin(ang) * 90, -40);
        ctx.stroke();
      });

      // Arreglo de Flores
      drawFlower(-42, -40, 1.05);
      drawFlower(42, -40, 1.05);
      drawFlower(-22, -78, 1.15);
      drawFlower(22, -78, 1.15);
      drawFlower(0, -115, 1.3);

      // Cinta roja/dorada vistosa
      ctx.fillStyle = '#d90429';
      ctx.fillRect(-25, 50, 50, 12);
      ctx.fillStyle = '#ffb703';
      ctx.beginPath();
      ctx.arc(0, 56, 9, 0, Math.PI * 2);
      ctx.fill();

      // Tarjeta de Regalo Clara
      ctx.save();
      ctx.translate(0, 10);
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 15;
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.fillRect(-125, 0, 250, 62);

      // Borde dorado
      ctx.strokeStyle = '#ffb703';
      ctx.lineWidth = 3;
      ctx.strokeRect(-120, 4, 240, 54);

      // Texto
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#10002b';
      ctx.font = 'bold italic 16px Georgia';
      ctx.textAlign = 'center';
      ctx.fillText('Para la persona más', 0, 27);
      ctx.fillText('importante para mí', 0, 48);
      ctx.restore();

      ctx.restore();
    }

    // Fondo Claro y Radiante (Verde Mágico Luminoso)
    function drawBackground() {
      const bgGrad = ctx.createRadialGradient(
        width / 2, height / 2 - 50, 20,
        width / 2, height / 2, Math.max(width, height)
      );
      bgGrad.addColorStop(0, '#52b788');   // Verde claro resplandeciente en el centro
      bgGrad.addColorStop(0.4, '#2d6a4f'); // Verde medio brillante
      bgGrad.addColorStop(0.8, '#1b4332'); // Verde esmeralda
      bgGrad.addColorStop(1, '#081c15');   // Bordes suaves

      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // Halo de luz dorado detrás del ramo
      ctx.save();
      const glowGrad = ctx.createRadialGradient(
        width / 2, height / 2, 10,
        width / 2, height / 2, 320
      );
      glowGrad.addColorStop(0, 'rgba(255, 234, 0, 0.35)');
      glowGrad.addColorStop(1, 'rgba(255, 234, 0, 0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(width / 2, height / 2, 320, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore
