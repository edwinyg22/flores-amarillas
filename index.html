<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramo de Flores Amarillas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1b1e;
      font-family: 'Georgia', serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <canvas id="mainCanvas"></canvas>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    let time = 0;

    // Partículas doradas y brillantes flotantes
    const particles = Array.from({ length: 70 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      radius: Math.random() * 3 + 1,
      speedY: -(Math.random() * 0.5 + 0.2),
      speedX: Math.random() * 0.4 - 0.2,
      opacity: Math.random() * 0.8 + 0.2
    }));

    // Dibujo de flor individual dentro del ramo
    function drawFlower(x, y, scale) {
      ctx.save();
      ctx.translate(x, y);

      // Pétalos amarillos vibrantes
      const petals = 12;
      ctx.fillStyle = '#ffea00';
      ctx.shadowBlur = 18;
      ctx.shadowColor = '#ffb700';

      for (let i = 0; i < petals; i++) {
        const angle = (i * Math.PI * 2) / petals;
        ctx.save();
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.ellipse(0, 22 * scale, 9 * scale, 20 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Centro de la flor
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(0, 0, 12 * scale, 0, Math.PI * 2);
      ctx.fillStyle = '#6b4226';
      ctx.fill();

      ctx.restore();
    }

    // Dibujo del Ramo Completo
    function drawBouquet(centerX, centerY, wind) {
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(wind);

      // Envoltura/Papel del Ramo
      ctx.fillStyle = '#3d2612';
      ctx.beginPath();
      ctx.moveTo(0, 140);
      ctx.lineTo(-65, -10);
      ctx.lineTo(65, -10);
      ctx.closePath();
      ctx.fill();

      // Tallos verdes
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 4;
      const stemAngles = [-0.3, -0.15, 0, 0.15, 0.3];
      stemAngles.forEach(ang => {
        ctx.beginPath();
        ctx.moveTo(0, 100);
        ctx.lineTo(Math.sin(ang) * 90, -40);
        ctx.stroke();
      });

      // Flores
      drawFlower(-40, -40, 1.0);
      drawFlower(40, -40, 1.0);
      drawFlower(-20, -75, 1.1);
      drawFlower(20, -75, 1.1);
      drawFlower(0, -110, 1.25);

      // Cinta dorada
      ctx.fillStyle = '#ffb703';
      ctx.fillRect(-25, 50, 50, 12);
      ctx.beginPath();
      ctx.arc(0, 56, 10, 0, Math.PI * 2);
      ctx.fill();

      // Tarjeta de Regalo
      ctx.save();
      ctx.translate(0, 10);
      ctx.fillStyle = '#fffdf0';
      ctx.shadowBlur = 12;
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.fillRect(-120, 0, 240, 60);

      // Borde dorado de la tarjeta
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 2;
      ctx.strokeRect(-116, 4, 232, 52);

      // Texto de la tarjeta
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#2b1e17';
      ctx.font = 'italic 15px Georgia';
      ctx.textAlign = 'center';
      ctx.fillText('Para la persona más', 0, 26);
      ctx.fillText('importante para mí', 0, 46);
      ctx.restore();

      ctx.restore();
    }

    // Fondo Místico y Colorido
    function drawBackground() {
      // Radial para dar luz cálida en el centro
      const bgGrad = ctx.createRadialGradient(
        width / 2, height / 2, 50,
        width / 2, height / 2, Math.max(width, height) / 1.2
      );
      bgGrad.addColorStop(0, '#1b4332');   // Verde esmeralda claro brillante
      bgGrad.addColorStop(0.4, '#081c15'); // Verde bosque profundo
      bgGrad.addColorStop(1, '#020d18');   // Azul oscuro bordes
      
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // Aura resplandeciente centro
      ctx.save();
      ctx.fillStyle = 'rgba(255, 215, 0, 0.08)';
      ctx.beginPath();
      ctx.arc(width / 2, height / 2, 280, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Bucle de animación
    function animate() {
      time += 0.02;
      ctx.clearRect(0, 0, width, height);

      drawBackground();

      const wind = Math.sin(time) * 0.04;

      // Dibujar ramo
      drawBouquet(width / 2, height / 2 + 30, wind);

      // Dibujar luces flotantes
      for (let p of particles) {
        ctx.fillStyle = `rgba(255, 240, 150, ${p.opacity})`;
        ctx.shadow
